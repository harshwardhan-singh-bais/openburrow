[project]
name = "openburrow-cli"
version = "0.1.0"
description = "OpenBurrow CLI and TUI: the terminal-native surface over the burrow daemon."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "openburrow-core",
  "openburrow-a2a",
  "openburrow-acp",
  "openburrow-adapters",
  "openburrow-governance",
  "openburrow-brain",
  "openburrow-radar",
  "openburrow-reel",
  "openburrow-daemon",
  "typer>=0.15",
  "rich>=13.9",
  "textual>=0.85",
  "httpx>=0.27",
  "shellingham>=1.5",
]

[project.scripts]
burrow = "openburrow.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openburrow"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]
