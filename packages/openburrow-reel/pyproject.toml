[project]
name = "openburrow-reel"
version = "0.1.0"
description = "OpenBurrow Session Reels: terminal-cast recording, causal event log, and static replay export."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "openburrow-core",
  "jinja2>=3.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openburrow"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]
