[project]
name = "openburrow-a2a"
version = "0.1.0"
description = "OpenBurrow A2A layer: Agent Cards, task lifecycle, JSON-RPC/SSE transport, and per-lane A2A servers."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "openburrow-core",
  "a2a-sdk>=0.2",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "starlette>=0.41",
  # [standard] is load-bearing, not decoration. Without it uvicorn falls back to
  # the pure-Python h11 parser, and on Windows that parser corrupts every request
  # after the first one on a keep-alive connection: the path is mangled into
  # something that matches no route, so the server answers 404 to routes that
  # demonstrably exist. It looks exactly like a routing bug in our own code and
  # is not one — `scripts/probe_lane_server.py` shows the scope uvicorn delivers,
  # and a fresh connection per request makes it vanish. [standard] pulls in
  # httptools, whose C parser handles keep-alive correctly.
  "uvicorn[standard]>=0.32",
  "anyio>=4.6",
]

[project.optional-dependencies]
# The official A2A Python SDK is the reference implementation of the wire
# protocol. It is a hard dependency above; this extra exists for the conformance
# test harness, which pulls the SDK's own test fixtures.
conformance = ["a2a-sdk>=0.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openburrow"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]
