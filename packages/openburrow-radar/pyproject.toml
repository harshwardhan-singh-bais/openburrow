[project]
name = "openburrow-radar"
version = "0.1.0"
description = "OpenBurrow Merge Radar: intent extraction and pairwise conflict prediction driving ACP negotiations."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "openburrow-core",
  "openburrow-acp",
  "litellm>=1.55",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openburrow"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]
