[project]
name = "openburrow-adapters"
version = "0.1.0"
description = "OpenBurrow harness adapters: PTY wrapping, structured-output detection, and per-harness translation."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.14"
dependencies = [
  "openburrow-core",
  "openburrow-acp",
  "ptyprocess>=0.7; sys_platform != 'win32'",
  "pexpect>=4.9; sys_platform != 'win32'",
  "pywinpty>=2.0; sys_platform == 'win32'",
  "httpx>=0.27",
  "mcp>=1.0",
  "litellm>=1.55",
  "tenacity>=9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openburrow"]

[dependency-groups]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "mypy>=1.13", "ruff>=0.8"]
